<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<!-- ล็อกสเกลบนมือถือให้พอดีและไม่ซูม -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Solar Cell Cleaning Systems</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --text:#0f172a; --muted:#64748b; --ring:#e5e7eb;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 6px 24px rgba(15,23,42,.06);
    --green:#22c55e; --green-600:#16a34a;
    --red:#ef4444; --red-600:#dc2626; --red-soft:#fee2e2;
    --tabGap:4px; /* ลดระยะห่างแท็บให้ชิดกันขึ้น */
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans Thai", sans-serif;
    display:flex;justify-content:center;align-items:flex-start;padding:16px;
  }
  /* ให้กว้างเต็มในมือถือ และไม่ล้น */
  .shell{
    width:100%; max-width:900px;
  }

  /* Header */
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  h1{font-size:20px;margin:0;font-weight:800}
  .status-badge{
    padding:8px 14px;border-radius:999px;border:1px solid var(--ring);
    background:#f8fafc; box-shadow:var(--shadow); min-width:110px; text-align:center; font-weight:700;
  }
  .status-badge.offline{background:#f3f4f6;color:#334155}
  .status-badge.online{background:#e8f8ee;color:var(--green-600);border-color:#bfe8ce}
  .status-badge.emergency{background:var(--red-soft);color:var(--red-600);border-color:#fecaca}

  /* Pill tabs – ทำให้ชิดกันขึ้น (gap/padding เล็กลง) และยืดตามจอมือถือ */
  .tabs-wrap{
    background:#ffffff;border:1px solid var(--ring);border-radius:999px;
    padding:4px; display:inline-flex; gap:var(--tabGap); box-shadow:var(--shadow); margin-bottom:12px;
    max-width:100%; overflow:auto; /* กันล้นบนจอเล็ก */
  }
  .tab{
    display:flex;align-items:center;gap:6px;
    padding:8px 12px;border-radius:999px;border:1px solid transparent;cursor:pointer;
    color:#334155;font-weight:800;background:transparent;transition:all .15s ease;
    white-space:nowrap;
  }
  .tab svg{width:18px;height:18px;opacity:.95;flex:0 0 auto}
  .tab.active{background:#eef2ff;border-color:#dbe3ff;box-shadow:var(--shadow);color:#111}

  /* mini-dot เฉพาะ Robot/Station */
  .mini-dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;flex:0 0 auto}
  .mini-dot.green{background:var(--green)}
  .mini-dot.red{background:var(--red)}

  /* --- Panels: ใช้สไลด์แบบแถบต่อเนื่อง --- */
  .viewport{
    position:relative; overflow:hidden; /* ซ่อนส่วนที่สไลด์หลุดขอบ */
    border-radius:16px;
  }
  .panels{
    display:flex; width:300%; /* 3 แท็บ = 3 หน้า */
    transform:translateX(0%); transition:transform .35s ease;  /* สไลด์นิ่ม ๆ */
  }
  .panel{
    min-width:100%; /* 1 หน้า = 100% ของ viewport */
    padding:0; /* padding ไปอยู่ในเนื้อหาข้างในแทน */
  }

  /* เนื้อหาด้านในแต่ละหน้า */
  .panel-inner{ padding:0; }

  /* Battery cards */
  .battery-card{
    background:var(--surface); border:1px solid var(--ring); border-radius:28px;
    padding:20px; margin:0 0 12px 0; box-shadow:var(--shadow);
  }
  .battery-title{font-size:22px;font-weight:800;margin:0 0 6px 0}
  .battery-sub{font-size:14px;color:#111;margin:0 0 12px 0}
  .bar{height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden;border:1px solid #d1d5db}
  .fill{height:100%;width:100%;background:var(--green)}

  /* Control rows */
  .row{
    background:var(--surface); border:1px solid var(--ring); border-radius:12px;
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:var(--shadow); margin-top:12px;
  }
  .row b{font-size:15px}
  .muted{color:var(--muted); font-size:12px; margin-top:2px}

  /* Switch */
  .switch{
    --w:46px; --h:24px; appearance:none; width:var(--w); height:var(--h);
    background:#e5e7eb; border-radius:999px; position:relative; border:1px solid #d1d5db; cursor:pointer;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.05);
  }
  .switch:after{
    content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .2s ease;
  }
  .switch:checked{background:#bbf7d0;border-color:#a7f3d0}
  .switch:checked:after{transform:translateX(22px)}
  .switch:disabled{opacity:.5; cursor:not-allowed}

  /* ปรับสำหรับจอเล็ก (เช่น iPhone 15 ~393px) ให้ทุกอย่างพอดี ไม่ต้องซูม */
  @media (max-width: 430px){
    body{ padding:12px; }
    .tabs-wrap{ padding:3px; }
    .tab{ padding:8px 10px; gap:6px; }
    .battery-card{ padding:16px; border-radius:22px; }
    .bar{ height:12px; }
    .row{ padding:12px 14px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Solar Cell Cleaning Systems</h1>
      <div id="statusBadge" class="status-badge offline">Offline</div>
    </header>

    <!-- Tabs: เอาจุดของ System ออก เหลือเฉพาะ Robot/Station -->
    <div class="tabs-wrap" role="tablist" aria-label="Main tabs">
      <!-- System (gear icon) -->
      <div id="tabControl" class="tab active" role="tab" aria-selected="true" aria-controls="panelControl" tabindex="0" data-index="0">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1 1 0 0 1 0 1.4l-1.2 1.2a1 1 0 0 1-1.4 0l-.1-.1a1 1 0 0 0-1.1-.2 8.9 8.9 0 0 1-2.5.7 1 1 0 0 0-.8.9V21a1 1 0 0 1-1 1H11a1 1 0 0 1-1-1v-.1a1 1 0 0 0-.8-.9 8.9 8.9 0 0 1-2.5-.7 1 1 0 0 0-1.1.2l-.1.1a1 1 0 0 1-1.4 0L3 17.6a1 1 0 0 1 0-1.4l.1-.1a1 1 0 0 0 .2-1.1 8.9 8.9 0 0 1-.7-2.5 1 1 0 0 0-.9-.8H1a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h.1a1 1 0 0 0 .9-.8 8.9 8.9 0 0 1 .7-2.5 1 1 0 0 0-.2-1.1l-.1-.1a1 1 0 0 1 0-1.4L3.6 3a1 1 0 0 1 1.4 0l.1.1a1 1 0 0 0 1.1.2 8.9 8.9 0 0 1 2.5-.7A1 1 0 0 0 9.5 2h.9a1 1 0 0 1 1 1v.1a1 1 0 0 0 .8.9 8.9 8.9 0 0 1 2.5.7 1 1 0 0 0 1.1-.2l.1-.1a1 1 0 0 1 1.4 0l1.2 1.2a1 1 0 0 1 0 1.4l-.1.1a1 1 0 0 0-.2 1.1 8.9 8.9 0 0 1 .7 2.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        <span>System</span>
      </div>

      <!-- Robot -->
      <div id="tabRobot" class="tab" role="tab" aria-selected="false" aria-controls="panelRobot" tabindex="-1" data-index="1">
        <span class="mini-dot" id="dotRobot"></span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 3h8v3H8zM5 10a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v5a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-5Z" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="10" cy="12" r="1" fill="currentColor"/>
          <circle cx="14" cy="12" r="1" fill="currentColor"/>
        </svg>
        <span>Robot</span>
      </div>

      <!-- Station (ใช้ไอคอนเดียวกับ Robot) -->
      <div id="tabStation" class="tab" role="tab" aria-selected="false" aria-controls="panelStation" tabindex="-1" data-index="2">
        <span class="mini-dot" id="dotStation"></span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 3h8v3H8zM5 10a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v5a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-5Z" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="10" cy="12" r="1" fill="currentColor"/>
          <circle cx="14" cy="12" r="1" fill="currentColor"/>
        </svg>
        <span>Station</span>
      </div>
    </div>

    <!-- Viewport + Panels (สไลด์) -->
    <div class="viewport" aria-live="polite">
      <div class="panels" id="panels">
        <!-- Page 0: System Control -->
        <section id="panelControl" class="panel" role="tabpanel" tabindex="0" aria-labelledby="tabControl">
          <div class="panel-inner">
            <div class="battery-card">
              <h3 class="battery-title">Robot</h3>
              <p class="battery-sub">battery percentage : 100%</p>
              <div class="bar"><div class="fill"></div></div>
            </div>

            <div class="battery-card">
              <h3 class="battery-title" style="text-transform:lowercase">station</h3>
              <p class="battery-sub">battery percentage : 100%</p>
              <div class="bar"><div class="fill"></div></div>
            </div>

            <div class="row">
              <div><b>Wash</b><div class="muted" id="washText">OFF</div></div>
              <input id="washSwitch" type="checkbox" class="switch" />
            </div>
            <div class="row">
              <div><b>Emergency</b><div class="muted" id="emgText">OFF</div></div>
              <input id="emgSwitch" type="checkbox" class="switch" />
            </div>
          </div>
        </section>

        <!-- Page 1: Robot -->
        <section id="panelRobot" class="panel" role="tabpanel" tabindex="0" aria-labelledby="tabRobot">
          <div class="panel-inner">
            <p class="muted" style="padding:12px 0 0 0">ข้อมูล Robot</p>
          </div>
        </section>

        <!-- Page 2: Station -->
        <section id="panelStation" class="panel" role="tabpanel" tabindex="0" aria-labelledby="tabStation">
          <div class="panel-inner">
            <p class="muted" style="padding:12px 0 0 0">ข้อมูล Station</p>
          </div>
        </section>
      </div>
    </div>
  </div>

<script>
  // Elements
  const badge=document.getElementById('statusBadge');
  const washSwitch=document.getElementById('washSwitch');
  const emgSwitch=document.getElementById('emgSwitch');
  const washText=document.getElementById('washText');
  const emgText=document.getElementById('emgText');

  const dotRobot=document.getElementById('dotRobot');
  const dotStation=document.getElementById('dotStation');

  // --- Tabs -> slide panels ---
  const panelsEl = document.getElementById('panels');
  const tabOrder = ['tabControl','tabRobot','tabStation'];
  tabOrder.forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('click', ()=>activateTab(el));
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); activateTab(el); }});
  });

  function activateTab(el){
    // active state on pills
    tabOrder.forEach(t=>{
      const tab=document.getElementById(t);
      tab.classList.remove('active');
      tab.setAttribute('aria-selected','false');
      tab.setAttribute('tabindex','-1');
    });
    el.classList.add('active');
    el.setAttribute('aria-selected','true');
    el.setAttribute('tabindex','0');

    // slide panels
    const idx = Number(el.dataset.index || 0);
    panelsEl.style.transform = `translateX(-${idx*100}%)`;
  }

  // --- Robot/Station status dots & alternating ---
  function setDots(r,s){
    dotRobot.className='mini-dot'+(r==='green'?' green':r==='red'?' red':'');
    dotStation.className='mini-dot'+(s==='green'?' green':s==='red'?' red':'');
  }
  let cycleTimer=null,activeSide='robot';
  function startAlternating(){
    stopAlternating();
    activeSide='robot'; setDots('green','');
    cycleTimer=setInterval(()=>{
      if(activeSide==='robot'){ setDots('', 'green'); activeSide='station'; }
      else{ setDots('green',''); activeSide='robot'; }
    },5000);
  }
  function stopAlternating(){ if(cycleTimer){ clearInterval(cycleTimer); cycleTimer=null; } }

  // Badge live region
  badge.setAttribute('aria-live','polite');

  function render(){
    const isWash=washSwitch.checked;
    const isEmg=emgSwitch.checked;

    washText.textContent=isWash?'ON':'OFF';
    emgText.textContent=isEmg?'ON':'OFF';

    if(isEmg){
      badge.textContent='EMERGENCY'; badge.className='status-badge emergency';
      if(isWash){ washSwitch.checked=false; washText.textContent='OFF'; }
      washSwitch.disabled=true; stopAlternating(); setDots('red','red'); return;
    }else{
      washSwitch.disabled=false;
    }

    if(isWash){
      badge.textContent='Online'; badge.className='status-badge online'; startAlternating();
    }else{
      badge.textContent='Offline'; badge.className='status-badge offline'; stopAlternating(); setDots('','');
    }
  }

  // หยุด/เริ่ม alternation เมื่อสลับแอป/กลับมา
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) stopAlternating();
    else if(washSwitch.checked && !emgSwitch.checked) startAlternating();
  });

  washSwitch.addEventListener('change',render);
  emgSwitch.addEventListener('change',render);
  render();

  // ตั้งต้นให้แท็บแรก active และ panels อยู่หน้า 0 (กันเคส browser autofill)
  activateTab(document.getElementById('tabControl'));
</script>
</body>
</html>
