<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solar Cell Cleaning Systems</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --text:#0f172a; --muted:#64748b; --ring:#e5e7eb;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 6px 24px rgba(15,23,42,.06);
    --green:#22c55e; --green-600:#16a34a;
    --red:#ef4444; --red-600:#dc2626; --red-soft:#fee2e2;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans Thai", sans-serif;
    display:flex;justify-content:center;align-items:flex-start;padding:20px;
  }
  .shell{width:min(900px,96vw)}

  /* Header */
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  h1{font-size:20px;margin:0;font-weight:800}
  .status-badge{
    padding:8px 14px;border-radius:999px;border:1px solid var(--ring);
    background:#f8fafc; box-shadow:var(--shadow); min-width:110px; text-align:center; font-weight:700;
  }
  .status-badge.offline{background:#f3f4f6;color:#334155}
  .status-badge.online{background:#e8f8ee;color:var(--green-600);border-color:#bfe8ce}
  .status-badge.emergency{background:var(--red-soft);color:var(--red-600);border-color:#fecaca}

  /* Pill tabs bar */
  .tabs-wrap{
    background:#ffffff;border:1px solid var(--ring);border-radius:999px;padding:6px;
    display:inline-flex;gap:8px;box-shadow:var(--shadow);margin-bottom:14px;
  }
  .tab{
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;border-radius:999px;border:1px solid transparent;cursor:pointer;
    color:#334155;font-weight:800; background:transparent;
    transition:all .15s ease;
  }
  .tab svg{width:18px;height:18px;opacity:.9}
  .tab.active{background:#eef2ff;border-color:#dbe3ff;box-shadow:var(--shadow);color:#111}

  /* Small status dots inside each tab (เหมือนฟังก์ชันเดิม) */
  .mini-dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}
  .mini-dot.green{background:var(--green)}
  .mini-dot.red{background:var(--red)}

  /* Panels */
  .panel{display:none}
  .panel.active{display:block}

  /* Battery cards layout (ใหญ่ โค้ง นุ่ม เหมือนภาพ) */
  .battery-card{
    background:var(--surface); border:1px solid var(--ring); border-radius:28px;
    padding:20px; margin:0 0 14px 0; box-shadow:var(--shadow);
  }
  .battery-title{font-size:22px;font-weight:800;margin:0 0 6px 0}
  .battery-sub{font-size:14px;color:#111;margin:0 0 12px 0}
  .bar{
    height:14px; background:#e5e7eb; border-radius:999px; overflow:hidden;
    border:1px solid #d1d5db;
  }
  .fill{height:100%; width:100%; background:var(--green)}

  /* Control rows */
  .row{
    background:var(--surface); border:1px solid var(--ring); border-radius:12px;
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:var(--shadow); margin-top:14px;
  }
  .row b{font-size:15px}
  .muted{color:var(--muted); font-size:12px; margin-top:2px}

  /* Switch */
  .switch{
    --w:46px; --h:24px; appearance:none; width:var(--w); height:var(--h);
    background:#e5e7eb; border-radius:999px; position:relative; border:1px solid #d1d5db; cursor:pointer;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.05);
  }
  .switch:after{
    content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .2s ease;
  }
  .switch:checked{background:#bbf7d0;border-color:#a7f3d0}
  .switch:checked:after{transform:translateX(22px)}
  .switch:disabled{opacity:.5; cursor:not-allowed}

  /* Robot/Station other panels just placeholder text */
  .panel p{color:#94a3b8}
</style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Solar Cell Cleaning Systems</h1>
      <div id="statusBadge" class="status-badge offline">Offline</div>
    </header>

    <div class="tabs-wrap" role="tablist" aria-label="Main tabs">
      <div id="tabControl" class="tab active" role="tab" aria-selected="true" aria-controls="panelControl" tabindex="0">
        <span class="mini-dot" id="dotSystem"></span>
        <!-- system icon -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-5l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>system</span>
      </div>
      <div id="tabRobot" class="tab" role="tab" aria-selected="false" aria-controls="panelRobot" tabindex="-1">
        <span class="mini-dot" id="dotRobot"></span>
        <!-- robot icon -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3h8v3H8zM5 10a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v5a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-5Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="12" r="1" fill="currentColor"/><circle cx="14" cy="12" r="1" fill="currentColor"/></svg>
        <span>Robot</span>
      </div>
      <div id="tabStation" class="tab" role="tab" aria-selected="false" aria-controls="panelStation" tabindex="-1">
        <span class="mini-dot" id="dotStation"></span>
        <!-- station/server icon -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="14" width="18" height="6" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="17" cy="7" r="1" fill="currentColor"/><circle cx="17" cy="17" r="1" fill="currentColor"/></svg>
        <span>Station</span>
      </div>
    </div>

    <!-- System Control panel -->
    <section id="panelControl" class="panel active" role="tabpanel" tabindex="0">
      <div class="battery-card">
        <h3 class="battery-title">Robot</h3>
        <p class="battery-sub">battery percentage : 100%</p>
        <div class="bar"><div class="fill"></div></div>
      </div>

      <div class="battery-card">
        <h3 class="battery-title" style="text-transform:lowercase">station</h3>
        <p class="battery-sub">battery percentage : 100%</p>
        <div class="bar"><div class="fill"></div></div>
      </div>

      <div class="row">
        <div><b>Wash</b><div class="muted" id="washText">OFF</div></div>
        <input id="washSwitch" type="checkbox" class="switch" />
      </div>
      <div class="row">
        <div><b>Emergency</b><div class="muted" id="emgText">OFF</div></div>
        <input id="emgSwitch" type="checkbox" class="switch" />
      </div>
    </section>

    <section id="panelRobot" class="panel" role="tabpanel" tabindex="0"><p>ข้อมูล Robot</p></section>
    <section id="panelStation" class="panel" role="tabpanel" tabindex="0"><p>ข้อมูล Station</p></section>
  </div>

<script>
  // Elements
  const badge=document.getElementById('statusBadge');
  const washSwitch=document.getElementById('washSwitch');
  const emgSwitch=document.getElementById('emgSwitch');
  const washText=document.getElementById('washText');
  const emgText=document.getElementById('emgText');

  // mini status dots (คงพฤติกรรมเดิม: เขียวสลับ/แดงตอน EMG)
  const dotSystem=document.getElementById('dotSystem');
  const dotRobot=document.getElementById('dotRobot');
  const dotStation=document.getElementById('dotStation');

  // Tabs
  const tabs={tabControl:'panelControl',tabRobot:'panelRobot',tabStation:'panelStation'};
  Object.keys(tabs).forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('click',()=>{
      for(const t in tabs){
        const tab=document.getElementById(t), panel=document.getElementById(tabs[t]);
        tab.classList.remove('active'); tab.setAttribute('aria-selected','false'); tab.setAttribute('tabindex','-1');
        panel.classList.remove('active');
      }
      el.classList.add('active'); el.setAttribute('aria-selected','true'); el.setAttribute('tabindex','0');
      document.getElementById(tabs[id]).classList.add('active');
    });
    el.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); }});
  });

  function setDots(r,s){
    // r,s in {'','green','red'}
    dotRobot.className='mini-dot'+(r==='green'?' green':r==='red'?' red':'');
    dotStation.className='mini-dot'+(s==='green'?' green':s==='red'?' red':'');
    // ระบบหลัก (system) เทาไว้เสมอ เพื่อให้หน้าตาเหมือนภาพ
    dotSystem.className='mini-dot';
  }

  let cycleTimer=null,activeSide='robot';
  function startAlternating(){
    stopAlternating();
    activeSide='robot'; setDots('green','');
    cycleTimer=setInterval(()=>{
      if(activeSide==='robot'){ setDots('', 'green'); activeSide='station'; }
      else{ setDots('green',''); activeSide='robot'; }
    },5000);
  }
  function stopAlternating(){ if(cycleTimer){ clearInterval(cycleTimer); cycleTimer=null; } }

  // Screen reader friendly
  badge.setAttribute('aria-live','polite');

  function render(){
    const isWash=washSwitch.checked;
    const isEmg=emgSwitch.checked;

    washText.textContent=isWash?'ON':'OFF';
    emgText.textContent=isEmg?'ON':'OFF';

    if(isEmg){
      badge.textContent='EMERGENCY'; badge.className='status-badge emergency';
      if(isWash){ washSwitch.checked=false; washText.textContent='OFF'; }
      washSwitch.disabled=true; stopAlternating(); setDots('red','red'); return;
    }else{
      washSwitch.disabled=false;
    }

    if(isWash){
      badge.textContent='Online'; badge.className='status-badge online'; startAlternating();
    }else{
      badge.textContent='Offline'; badge.className='status-badge offline'; stopAlternating(); setDots('','');
    }
  }

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) stopAlternating();
    else if(washSwitch.checked && !emgSwitch.checked) startAlternating();
  });

  washSwitch.addEventListener('change',render);
  emgSwitch.addEventListener('change',render);
  render();
</script>
</body>
</html>
